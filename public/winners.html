<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>中獎紀錄</title>
<link rel="icon" href="/brand/favicon">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  .wrap { max-width: 1680px; margin: 0 auto; padding: 0 16px 60px; }
  .login { max-width: 400px; margin: 12vh auto 0; padding: 32px 28px; }
  .login h1 { margin: 0 0 20px; font-size: 22px; letter-spacing: .1em; }
  [hidden] { display: none !important; }
  .panel { padding: 26px 26px 30px; }
  .panel h3 { margin: 0 0 4px; font-size: 21px; letter-spacing: .1em; font-family: var(--font-display); color: var(--gold-hi); }
  .panel .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line-soft); }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; min-width: 640px; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; background: rgba(40,2,6,.45); position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  td.num { color: var(--gold-hi); font-weight: 700; }
  td.cls { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.idno { font-family: ui-monospace, Consolas, monospace; letter-spacing: .04em; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; background: rgba(216,172,90,.15); color: var(--gold-hi); }
  .muted { color: var(--muted); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) { .panel { padding: 20px 16px; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-logo" src="/brand/logo" data-asset="logo" alt="Logo"><span>在校生抽獎・中獎紀錄</span></div>
  <button class="btn-ghost" id="logout" hidden>登出</button>
</header>

<section class="card login" id="loginCard" hidden>
  <h1>中獎紀錄登入</h1>
  <div id="loginErr" class="msg err" hidden></div>
  <form id="loginForm">
    <div class="field"><label for="pw">密碼</label><input class="input" type="password" id="pw" autocomplete="current-password" autofocus></div>
    <button class="btn-gold" style="width:100%;font-size:18px">登入</button>
  </form>
</section>

<main class="wrap" id="app" hidden>
  <section class="card panel">
    <div class="toolbar"><div><h3>中獎紀錄</h3></div><span class="muted" id="count"></span></div>
    <p class="sub">抽獎畫面抽出後會自動出現在這裡（約 5 秒更新一次），最新抽出的排在最上面。這一頁只能查看，不能修改。</p>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>姓名</th><th>學號</th><th>系所</th><th>電話</th><th>抽出時間</th></tr></thead>
      <tbody id="winnerRows"></tbody>
    </table></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dash = '<span class="muted">—</span>';
const fmt = (iso) => new Date(iso).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/winners/login') { showLogin(); throw new Error('未登入'); }
  if (!r.ok) throw new Error(d.error || '操作失敗');
  return d;
}
function showLogin() { $('#loginCard').hidden = false; $('#app').hidden = true; $('#logout').hidden = true; }
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { await api('/api/winners/login', { method: 'POST', body: { password: $('#pw').value } }); $('#loginCard').hidden = true; $('#pw').value = ''; load(); }
  catch (err) { const b = $('#loginErr'); b.textContent = err.message; b.hidden = false; }
});
$('#logout').addEventListener('click', async () => { await api('/api/winners/logout', { method: 'POST' }).catch(() => {}); showLogin(); });

async function load() {
  let d; try { d = await api('/api/winners'); } catch { return; }
  $('#app').hidden = false; $('#logout').hidden = false;
  const rows = d.winners.slice().reverse();
  $('#count').textContent = '共 ' + rows.length + ' 筆';
  $('#winnerRows').innerHTML = rows.length ? rows.map((w, i) => `<tr>
    <td class="num">${rows.length - i}</td>
    <td><b>${esc(w.name)}</b></td>
    <td class="num">${esc(w.studentNo) || dash}</td>
    <td>${esc(w.dept) || dash}</td>
    <td>${esc(w.phone) || dash}</td>
    <td class="muted">${fmt(w.drawnAt)}</td></tr>`).join('')
    : '<tr><td colspan="6" class="empty">還沒有抽出任何人</td></tr>';
}
setInterval(() => { if (!$('#app').hidden && document.visibilityState === 'visible') load(); }, 5000);
load();
</script>
</body>
</html>
