<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世新在校生抽獎報名</title>
<link rel="icon" href="/brand/favicon">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 60px; }
  .hero { position: relative; text-align: center; padding: 28px 0 30px; }
  .hero h1 { font-size: var(--reg-title-size); margin: 0 0 12px; letter-spacing: .14em; font-family: var(--font-display); }
  .hero h1 span { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 0; color: var(--text); font-size: 16px; line-height: 1.7; text-shadow: 0 1px 8px rgba(60,0,4,.9), 0 0 2px rgba(60,0,4,.8); }
  @keyframes float { 50% { transform: translateY(-12px); } }
  .form { padding: 30px 28px; }
  .form h2 { margin: 0 0 6px; font-size: 22px; font-family: var(--font-display); letter-spacing: .1em; color: var(--gold-hi); }
  .form .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .submit { width: 100%; margin-top: 8px; }
  .privacy { color: var(--muted); font-size: 12.5px; line-height: 1.7; margin-top: 18px; text-align: center; }
  .lock { display: inline-flex; align-items: center; gap: 6px; }
  .done { padding: 44px 28px; text-align: center; }
  .done .big-ball { position: relative; width: 120px; height: 120px; margin: 0 auto 22px; display: grid; place-items: center; animation: drop .7s cubic-bezier(.3,1.6,.5,1); }
  .done .big-ball span { position: relative; z-index: 1; font-weight: 900; color: var(--btn-text); font-size: 30px; }
  @keyframes drop { from { transform: translateY(-80px) scale(.6); opacity: 0; } }
  .done h2 { margin: 0 0 10px; font-size: 28px; letter-spacing: .12em; font-family: var(--font-display); color: var(--gold-hi); }
  .done p { color: var(--muted); line-height: 1.8; margin: 0; }
  .done h2 { margin-bottom: 0; }
  .done .who { margin-top: 14px; color: var(--muted); font-size: 14px; }
  .closed { padding: 44px 28px; text-align: center; }
  .closed h2 { margin: 0 0 10px; }
  .closed p { color: var(--muted); margin: 0; }
  @media (max-width: 520px) { .form { padding: 24px 18px; } }
</style>
</head>
<body>
<div class="watermark" aria-hidden="true" data-t="reg.watermark">STUDENTS</div>
<header class="topbar">
  <div class="brand"><img class="brand-logo" src="/brand/logo" data-asset="logo" alt="Logo"><span data-t="reg.brand">世新大學 70 週年</span></div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="id-badge" data-t="reg.badge">在校生場　STUDENTS</div>
    <h1><span data-t="reg.title">世新大學在校生抽獎活動</span></h1>
    <p data-t="reg.intro">輸入學號與姓名，系統會比對在校生名單，完成報名。
每人限報名一次，祝你好運！</p>
  </section>

  <section class="card form" id="formCard">
    <h2 data-t="reg.formTitle">學生報名</h2>
    <p class="sub" data-t="reg.formSub">請輸入學號與姓名，系統會自動比對在校生名單</p>
    <div id="err" class="msg err" hidden></div>
    <form id="f" novalidate autocomplete="on">
      <div class="field">
        <label for="account"><span data-t="reg.account">學號</span><span class="req">*</span></label>
        <input class="input" id="account" name="username" autocomplete="username" maxlength="40" data-tp="reg.accountPh" placeholder="例：A1100123" style="text-transform:uppercase">
      </div>
      <div class="field">
        <label for="name"><span data-t="reg.name">姓名</span><span class="req">*</span></label>
        <input class="input" id="name" name="name" type="text" autocomplete="name" maxlength="40" data-tp="reg.namePh" placeholder="請輸入本人姓名">
      </div>
      <button class="btn-gold submit" id="submit" type="submit" data-t="reg.submit">送出並報名</button>
      <p class="privacy"><span class="lock">🔒 <span data-t="reg.privacy">系統僅比對學號與姓名是否相符於本次活動匯入的在校生名單，不會另外收集密碼。資料僅用於本次抽獎活動。</span></span></p>
    </form>
  </section>

  <section class="card done" id="done" hidden>
    <div class="big-ball ball c-gold"><span id="doneIcon">✓</span></div>
    <h2 id="doneTitle">已完成登記</h2>
  </section>

  <section class="card closed" id="closed" hidden>
    <h2 data-t="reg.closedTitle">報名已截止</h2>
    <p data-t="reg.closedText">本次活動已停止報名，感謝你的關注。</p>
  </section>
</main>

<script src="/assets/design.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let doneData = { name: '王小明', no: 'S0001' }, already = false;

function showView(v) {
  $('#formCard').hidden = v !== 'form';
  $('#done').hidden = v !== 'done';
  $('#closed').hidden = v !== 'closed';
}
function renderDynamic() {
  document.title = T('reg.title');
  $('#doneTitle').textContent = T(already ? 'reg.againTitle' : 'reg.doneTitle');
  $('#doneIcon').textContent = already ? '★' : '✓';
}
renderDynamic();
document.addEventListener('designchange', renderDynamic);
document.addEventListener('previewview', (e) => {
  already = e.detail === 'again';
  renderDynamic();
  showView(e.detail === 'again' ? 'done' : e.detail);
});

if (!DESIGN_PREVIEW) {
  fetch('/api/status').then(r => r.json()).then(s => {
    if (!s.open) showView('closed');
  }).catch(() => {});
}

function showErr(text, field) {
  const box = $('#err');
  box.textContent = text; box.hidden = false;
  document.querySelectorAll('.input').forEach(i => i.classList.remove('bad'));
  if (field) { const el = $('#' + field); if (el) { el.classList.add('bad'); el.focus(); } }
}
document.querySelectorAll('.input').forEach(i => i.addEventListener('input', () => i.classList.remove('bad')));

$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#err').hidden = true;
  const studentNo = $('#account').value.trim();
  const name = $('#name').value.trim();
  if (DESIGN_PREVIEW) { doneData = { name: name || '王小明', no: 'S0001' }; renderDynamic(); return showView('done'); } // 預覽不送出
  if (!studentNo) return showErr('請輸入' + T('reg.account') + '。', 'account');
  if (!name) return showErr('請輸入' + T('reg.name') + '。', 'name');
  const btn = $('#submit'); btn.disabled = true; btn.textContent = T('reg.submitting');
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ studentNo, name }) });
    const d = await r.json();
    if (!r.ok) return showErr(d.error || '報名失敗，請稍後再試。', d.field);
    already = !!d.already;
    doneData = { name: d.name, no: d.no };
    renderDynamic();
    showView('done');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch { showErr('網路連線異常，請稍後再試。'); }
  finally { btn.disabled = false; btn.textContent = T('reg.submit'); }
});
</script>
</body>
</html>
