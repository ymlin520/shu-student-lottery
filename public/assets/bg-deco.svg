<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd9a0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffe08a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f2b93b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bokehGold"><stop offset="0" stop-color="#ffd35c" stop-opacity=".55"/><stop offset="1" stop-color="#ffd35c" stop-opacity="0"/></radialGradient>
    <radialGradient id="bokehBlue"><stop offset="0" stop-color="#ffb870" stop-opacity=".40"/><stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="bokehPink"><stop offset="0" stop-color="#ff7a8a" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a8a" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffe3b5" fill-opacity=".18"/></pattern>
    <linearGradient id="fadeDots" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="dotMask"><rect width="1600" height="900" fill="url(#fadeDots)"/></mask>
  </defs>

  <!-- 左上點陣 -->
  <rect width="1600" height="900" fill="url(#dots)" mask="url(#dotMask)"/>
  <rect width="1600" height="900" fill="url(#dots)" mask="url(#dotMask)" transform="rotate(180 800 450)"/>

  <!-- 斜向光束 -->
  <g transform="rotate(-24 800 450)">
    <rect x="-400" y="120" width="2400" height="90" fill="url(#beam)"/>
    <rect x="-400" y="330" width="2400" height="46" fill="url(#beam)"/>
    <rect x="-400" y="640" width="2400" height="140" fill="url(#beam)"/>
  </g>

  <!-- 金色細線 -->
  <path d="M-40 800 C 460 720, 980 520, 1640 120" fill="none" stroke="url(#goldLine)" stroke-width="2"/>
  <path d="M-40 840 C 520 760, 1040 560, 1640 170" fill="none" stroke="url(#goldLine)" stroke-width="1" opacity=".6"/>

  <!-- 中央淡同心圈（呼應抽獎機） -->
  <g fill="none" stroke="#ffe3b5">
    <circle cx="800" cy="400" r="330" stroke-opacity=".10"/>
    <circle cx="800" cy="400" r="420" stroke-opacity=".07"/>
    <circle cx="800" cy="400" r="520" stroke-opacity=".05"/>
  </g>

  <!-- 散景光點 -->
  <circle cx="1420" cy="170" r="150" fill="url(#bokehGold)"/>
  <circle cx="180" cy="720" r="130" fill="url(#bokehBlue)"/>
  <circle cx="1300" cy="760" r="100" fill="url(#bokehPink)"/>
  <circle cx="260" cy="180" r="70" fill="url(#bokehGold)"/>
  <circle cx="1520" cy="560" r="60" fill="url(#bokehBlue)"/>
  <circle cx="620" cy="840" r="55" fill="url(#bokehGold)"/>

  <!-- 小亮點與小方塊（活潑感） -->
  <g fill="#ffe08a">
    <circle cx="120" cy="420" r="3" opacity=".7"/><circle cx="1480" cy="330" r="2.5" opacity=".6"/>
    <circle cx="980" cy="120" r="2" opacity=".5"/><circle cx="420" cy="620" r="2.2" opacity=".5"/>
    <rect x="1180" y="240" width="7" height="7" transform="rotate(20 1183 243)" opacity=".5"/>
    <rect x="360" y="300" width="6" height="6" transform="rotate(45 363 303)" fill="#5cc8ff" opacity=".6"/>
    <rect x="1080" y="700" width="8" height="8" transform="rotate(30 1084 704)" fill="#ff7a8a" opacity=".5"/>
    <rect x="720" y="90" width="6" height="6" transform="rotate(15 723 93)" fill="#5fd6a7" opacity=".55"/>
  </g>
</svg>
